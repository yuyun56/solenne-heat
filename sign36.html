<script>
const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function base58(bytes) {
  let zeros = 0; while (zeros < bytes.length && bytes[zeros] === 0) zeros++;
  let n = Array.from(bytes); let out = '';
  let start = zeros;
  while (start < n.length) {
    let rem = 0;
    for (let i = start; i < n.length; i++) { const cur = rem * 256 + n[i]; n[i] = Math.floor(cur / 58); rem = cur % 58; }
    out = B58[rem] + out;
    while (start < n.length && n[start] === 0) start++;
  }
  return '1'.repeat(zeros) + out;
}
const status = document.getElementById('status');
const out = document.getElementById('out');
document.getElementById('sign').addEventListener('click', async () => {
  try {
    const provider = (window.okxwallet && window.okxwallet.solana) || window.solana;
    if (!provider) { status.textContent = 'Wallet Solana tidak terdeteksi. Buka halaman ini dari browser di dalam aplikasi OKX Wallet / Phantom.'; return; }
    status.textContent = 'Menghubungkan wallet…';
    const conn = await provider.connect();
    const pub = (conn && conn.publicKey) ? conn.publicKey.toString() : (provider.publicKey ? provider.publicKey.toString() : '');
    status.textContent = 'Terhubung: ' + pub + ' — menyetujui tanda tangan di wallet…';
    const message = document.getElementById('msg').value;
    const encoded = new TextEncoder().encode(message);
    const res = await provider.signMessage(encoded, 'utf8');
    const sig = res && res.signature ? res.signature : res;
    const text = base58(sig instanceof Uint8Array ? sig : new Uint8Array(sig));
    out.textContent = text;
    document.getElementById('copy').disabled = false;
    status.textContent = 'Selesai. Salin signature di atas dan kirimkan ke Ember.';
  } catch (e) {
    status.textContent = 'Gagal/dibatalkan: ' + (e && e.message ? e.message : e);
  }
});
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(out.textContent); status.textContent = 'Signature tersalin.'; }
  catch (e) { status.textContent = 'Salin manual: tekan lama pada signature.'; }
});
</script>
